<section class="section" style="min-height: 100vh; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- General Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
            </div>

            <div class="section-header text-center mb-4">
              <h2 class="text-uppercase small text-muted">Welcome Back</h2>
              <p class="h1" style="font-family: 'Amatic SC', cursive;">Sign in to your <span style="color: #ce1212;">Account</span></p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

              <!-- Phone Field -->
              <div class="mb-4">
                <label class="form-label fw-bold">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-phone" style="color: #ce1212;"></i></span>
                  <input
                    type="tel"
                    class="form-control"
                    formControlName="telephone"
                    placeholder="Enter your phone number"
                    [class.is-invalid]="(telephone?.invalid && telephone?.touched) || fieldErrors.telephone">
                </div>

                <!-- Validation Errors -->
                <div *ngIf="telephone?.invalid && telephone?.touched" class="text-danger small mt-1">
                  <div *ngIf="telephone?.errors?.['required']">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    Phone number is required
                  </div>
                  <div *ngIf="telephone?.errors?.['pattern']">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    Phone number must contain only digits
                  </div>
                </div>

                <!-- Server Error -->
                <div *ngIf="fieldErrors.telephone" class="text-danger small mt-1">
                  <i class="bi bi-exclamation-circle me-1"></i>
                  {{ fieldErrors.telephone }}
                </div>
              </div>

              <!-- Password Field -->
              <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock" style="color: #ce1212;"></i></span>
                  <input
                    type="password"
                    class="form-control"
                    formControlName="password"
                    placeholder="Enter your password"
                    [class.is-invalid]="(password?.invalid && password?.touched) || fieldErrors.password">
                </div>

                <!-- Validation Error -->
                <div *ngIf="password?.invalid && password?.touched" class="text-danger small mt-1">
                  <i class="bi bi-exclamation-circle me-1"></i>
                  Password is required
                </div>

                <!-- Server Error -->
                <div *ngIf="fieldErrors.password" class="text-danger small mt-1">
                  <i class="bi bi-exclamation-circle me-1"></i>
                  {{ fieldErrors.password }}
                </div>
              </div>

              <!-- Forgot Password Link -->
              <div class="text-end mb-4">
                <a routerLink="/forgot-password" class="text-decoration-none" style="color: #ce1212;">
                  Forgot password?
                </a>
              </div>

              <!-- Login Button -->
              <button
                type="submit"
                class="btn w-100 py-3"
                style="background: #ce1212; color: white; border-radius: 50px; font-weight: 600;"
                [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Signing in...' : 'Sign in' }}
              </button>

              <!-- Register Link -->
              <div class="text-center mt-4">
                <p class="mb-0">
                  Don't have an account?
                  <a routerLink="/register" class="text-decoration-none fw-bold" style="color: #ce1212;">
                    Sign up <i class="bi bi-arrow-right"></i>
                  </a>
                </p>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
