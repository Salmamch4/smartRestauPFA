<section class="section" style="min-height: 100vh; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- Success Message -->
            <div *ngIf="message" class="alert alert-success alert-dismissible fade show" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              {{ message }}
            </div>

            <!-- Error Message -->
            <div *ngIf="error.password" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ error.password }}
            </div>

            <div class="section-header text-center mb-4">
              <h2 class="text-uppercase small text-muted">Reset Password</h2>
              <p class="h1" style="">Recover your <span style="color: #ce1212;">Password</span></p>
            </div>

            <form (ngSubmit)="onSubmit(resetForm)" #resetForm="ngForm">

              <!-- Password Field -->
              <div class="mb-4">
                <label class="form-label fw-bold">New Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock" style="color: #ce1212;"></i></span>
                  <input type="password" class="form-control" placeholder="Enter your new password" name="password" ngModel required>
                </div>
              </div>

              <!-- Confirm Password Field -->
              <div class="mb-4">
                <label class="form-label fw-bold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock" style="color: #ce1212;"></i></span>
                  <input type="password" class="form-control" placeholder="Confirm your new password" name="password_confirmation" ngModel required>
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn w-100 py-3" style="background: #ce1212; color: white; border-radius: 50px; font-weight: 600;">
                Change Password
              </button>

              <!-- Login Link -->
              <div class="text-center mt-4">
                <p class="mb-0">
                  Remembered your password? 
                  <a routerLink="/login" class="text-decoration-none fw-bold" style="color: #ce1212;">
                    Login <i class="bi bi-arrow-right"></i>
                  </a>
                </p>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
