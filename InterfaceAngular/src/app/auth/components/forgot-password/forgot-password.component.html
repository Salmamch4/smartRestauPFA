<section class="section" style="min-height: 100vh; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- Message d'alerte -->
            <div *ngIf="message" class="alert alert-info alert-dismissible fade show" role="alert">
              <i class="fas fa-info-circle me-2"></i>{{ message }}
              <button type="button" class="btn-close" (click)="message = ''"></button>
            </div>

            <div class="section-header text-center mb-4">
              <h2 class="text-uppercase small text-muted">Forgot Your Password?</h2>
              <p class="h1" >Reset your <span style="color: #ce1212;">Password</span></p>
            </div>

            <!-- Formulaire de réinitialisation -->
            <form (ngSubmit)="onSubmit(forgotForm)" #forgotForm="ngForm">

              <!-- Email Field -->
              <div class="mb-4">
                <label class="form-label fw-bold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-envelope" style="color: #ce1212;"></i></span>
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    ngModel
                    placeholder="Enter your email"
                    [class.is-invalid]="forgotForm.controls['email']?.invalid && forgotForm.controls['email']?.touched">
                </div>

                <!-- Validation Errors -->
                <div *ngIf="forgotForm.controls['email']?.invalid && forgotForm.controls['email']?.touched" class="text-danger small mt-1">
                  <div *ngIf="forgotForm.controls['email']?.errors?.['required']">
                    <i class="bi bi-exclamation-circle me-1"></i>Email is required
                  </div>
                  <div *ngIf="forgotForm.controls['email']?.errors?.['email']">
                    <i class="bi bi-exclamation-circle me-1"></i>Please enter a valid email address
                  </div>
                </div>

                <!-- Erreur serveur -->
                <div *ngIf="error.email" class="text-danger small mt-1">
                  <i class="bi bi-exclamation-circle me-1"></i>{{ error.email }}
                </div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                class="btn w-100 py-3"
                style="background: #ce1212; color: white; border-radius: 50px; font-weight: 600;"
                [disabled]="wait">
                <span *ngIf="wait" class="spinner-border spinner-border-sm me-2"></span>
                {{ wait ? 'Sending email...' : 'Send Reset Link' }}
              </button>

            </form>

            <!-- Lien de connexion -->
            <div class="text-center mt-4">
              <p class="mb-0">
                Remember your password?
                <a routerLink="/login" class="text-decoration-none fw-bold" style="color: #ce1212;">
                  Login <i class="bi bi-arrow-right"></i>
                </a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
