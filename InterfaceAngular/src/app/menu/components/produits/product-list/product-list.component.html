<div class="container-fluid py-4">
  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    
    <div class="card-header bg-white py-4 border-0">
      <div class="row align-items-center g-3">
        <div class="col-md-4">
          <h3 class="fw-bold mb-0">Liste des <span class="text-danger">Produits</span></h3>
        </div>
        
        <div class="col-md-5">
          <div class="input-group bg-light rounded-pill px-3 border shadow-sm">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-filter-right text-danger fs-5"></i></span>
            <select class="form-select bg-transparent border-0" [(ngModel)]="filterCategorieId">
              <option value="">Toutes les catégories</option>
              <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.libelle }}</option>
            </select>
          </div>
        </div>

        <div class="col-md-3 text-end">
          <button class="btn btn-danger rounded-pill px-4 py-2 shadow-sm" (click)="router.navigate(['/menu/produits/add'])">
            <i class="bi bi-plus-lg me-2"></i>Nouveau Produit
          </button>
        </div>
      </div>
    </div>

    <div class="card-body p-0">
      <div *ngIf="errorMessage" class="alert alert-danger m-3 border-0 rounded-3 shadow-sm">{{ errorMessage }}</div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr class="text-uppercase small fw-bold text-muted">
              <th class="ps-4 py-3">Photo</th>
              <th>Nom du Produit</th>
              <th>Catégorie</th>
              <th>Prix (DH)</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let prod of filteredProduits()">
              <td class="ps-4">
                <img [src]="prod.imagePath ? 'https://localhost:7277' + prod.imagePath : 'assets/img/default-product.png'"
                     class="rounded-3 shadow-sm border"
                     style="height: 60px; width: 60px; object-fit: cover;"
                     alt="Photo">
              </td>
              <td>
                <div class="fw-bold text-dark">{{ prod.nom }}</div>
                
                <div class="dropdown">
                  <button class="btn btn-sm btn-link text-danger text-decoration-none p-0 small" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-list-check me-1"></i>Ingrédients
                  </button>
                  <ul class="dropdown-menu shadow border-0 p-2">
                    <ng-container *ngIf="prod.ingredients && prod.ingredients.length > 0; else noIngredients">
                      <li *ngFor="let ing of prod.ingredients" class="small p-1">
                        <span class="badge bg-danger-subtle text-danger me-1">{{ ing.quantite }}</span> {{ ing.articleNom }}
                      </li>
                    </ng-container>
                    <ng-template #noIngredients>
                      <li class="text-muted small px-2">Aucun ingrédient</li>
                    </ng-template>
                  </ul>
                </div>
              </td>
              <td>
                <span class="badge bg-light text-danger border border-danger px-3 rounded-pill fw-medium">{{ prod.categorieLibelle }}</span>
              </td>
              <td class="fw-bold">{{ prod.prix | number:'1.2-2' }}</td>
              <td class="text-center">
                <div class="d-flex gap-2 justify-content-center">
                  <button class="btn btn-outline-primary btn-sm rounded-circle shadow-sm" style="width: 32px; height: 32px;" (click)="editProduct(prod.id)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-outline-danger btn-sm rounded-circle shadow-sm" style="width: 32px; height: 32px;" (click)="deleteProduct(prod.id)">
                    <i class="bi bi-trash3"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div *ngIf="filteredProduits().length === 0" class="text-center py-5">
        <i class="bi bi-search display-4 text-light"></i>
        <p class="text-muted mt-3">Aucun produit trouvé.</p>
      </div>
    </div>
  </div>
</div>
