<div class="container mt-4">

  <h2 class="mb-3">Liste des articles</h2>

  <a routerLink="/articles/create" class="btn btn-success mb-3">
    + Ajouter Article
  </a>

  <table class="table table-bordered table-hover text-center">
    
    <thead class="table-dark">
      <tr>
        <th>Libelle</th>
        <th>Stock</th>
        <th>Seuil</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let article of articles">
        <td>{{ article.libelle }}</td>
        <td>{{ article.quantiteEnStock }}</td>
        <td>{{ article.seuilAlerte }}</td>

        <td>
          <!-- ❌ كان غلط -->
          <!-- /update-article -->

          <!-- ✅ الصحيح -->
          <a 
            [routerLink]="['/articles/update', article.id]" 
            class="btn btn-sm btn-primary me-2">
            Edit
          </a>

          <button 
            (click)="deleteArticle(article.id!)" 
            class="btn btn-sm btn-danger">
            Delete
          </button>
        </td>
      </tr>
    </tbody>

  </table>

</div>
