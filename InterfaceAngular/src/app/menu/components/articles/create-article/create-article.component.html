<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            
            <!-- Header -->
            <div class="section-header text-center mb-4">
              <h2 class="text-uppercase small text-muted">Gestion des Articles</h2>
              <p class="h1">
                Nouvel <span style="color: #ce1212;">Article</span>
              </p>
            </div>

            <!-- Messages -->
            <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
              <i class="bi bi-check-circle me-2"></i> {{ successMessage }}
              <button type="button" class="btn-close" (click)="successMessage = ''"></button>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
              <i class="bi bi-exclamation-triangle me-2"></i> {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
            </div>

            <!-- Formulaire Article -->
            <form (ngSubmit)="createArticle()">
              
              <!-- Libelle (100%) -->
              <div class="mb-4">
                <label class="form-label fw-bold">
                  <i class="bi bi-box me-2" style="color: #ce1212;"></i> Libellé
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-box" style="color: #ce1212;"></i></span>
                  <input 
                    type="text" 
                    class="form-control" 
                    [(ngModel)]="article.libelle" 
                    name="libelle" 
                    required
                    placeholder="Ex: Farine, Sucre, Huile...">
                </div>
              </div>

              <div class="row g-4">
                
                <!-- Stock -->
                <div class="col-md-4">
                  <label class="form-label fw-bold">
                    <i class="bi bi-database me-2" style="color: #ce1212;"></i> Stock
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-database" style="color: #ce1212;"></i></span>
                    <input 
                      type="number" 
                      class="form-control" 
                      [(ngModel)]="article.quantiteEnStock" 
                      name="stock"
                      placeholder="Quantité">
                  </div>
                </div>

                <!-- Seuil d'alerte -->
                <div class="col-md-4">
                  <label class="form-label fw-bold">
                    <i class="bi bi-exclamation-triangle me-2" style="color: #ce1212;"></i> Seuil d'alerte
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-exclamation-triangle" style="color: #ce1212;"></i></span>
                    <input 
                      type="number" 
                      class="form-control" 
                      [(ngModel)]="article.seuilAlerte" 
                      name="seuil"
                      placeholder="Seuil">
                  </div>
                </div>

                <!-- Unité -->
                <div class="col-md-4">
                  <label class="form-label fw-bold">
                    <i class="bi bi-rulers me-2" style="color: #ce1212;"></i> Unité
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-rulers" style="color: #ce1212;"></i></span>
                    <select class="form-select" [(ngModel)]="article.unite" name="unite">
                      <option value="">-- Choisir --</option>
                      <option value="kg">Kg (Kilogramme)</option>
                      <option value="g">g (Grammes)</option>
                      <option value="L">L (Litre)</option>
                      <option value="ml">ml (Millilitre)</option>
                      <option value="piece">Pièce</option>
                      <option value="sac">Sac</option>
                      <option value="carton">Carton</option>
                    </select>
                  </div>
                </div>
              </div>

              <hr class="my-4">

              <!-- Boutons d'action -->
              <div class="d-flex gap-3 justify-content-center">
                <button type="submit" class="btn btn-success px-4" [disabled]="loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  <i class="bi bi-check-lg me-2"></i> Ajouter
                </button>
                <button type="button" class="btn btn-secondary px-4" (click)="resetForm()">
                  <i class="bi bi-arrow-repeat me-2"></i> Réinitialiser
                </button>
                <a routerLink="/articles" class="btn btn-link">
                  <i class="bi bi-list me-2"></i> Voir tous
                </a>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
