<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- Header -->
            <div class="section-header text-center mb-4">
              <h2 class="text-uppercase small text-muted">Gestion des Catégories</h2>
              <p class="h1" style="font-family: 'Amatic SC', cursive;">
                {{ isEditMode ? 'Modifier' : 'Nouvelle' }}
                <span style="color: #ce1212;">Catégorie</span>
              </p>
            </div>

            <!-- Messages -->
            <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
              <i class="bi bi-check-circle me-2"></i> {{ successMessage }}
              <button type="button" class="btn-close" (click)="successMessage = ''"></button>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
              <i class="bi bi-exclamation-triangle me-2"></i> {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
            </div>

            <!-- Formulaire -->
            <div class="mb-4">
              <label class="form-label fw-bold">
                <i class="bi bi-tag me-2" style="color: #ce1212;"></i> Libellé
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light">
                  <i class="bi bi-tag" style="color: #ce1212;"></i>
                </span>
                <input type="text" class="form-control" [(ngModel)]="libelle"
                  placeholder="Nom de la catégorie" maxlength="20">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">
                <i class="bi bi-card-text me-2" style="color: #ce1212;"></i> Description
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light">
                  <i class="bi bi-card-text" style="color: #ce1212;"></i>
                </span>
                <textarea class="form-control" [(ngModel)]="description"
                  placeholder="Description (optionnel)" rows="3" maxlength="200"></textarea>
              </div>
            </div>

            <!-- Boutons -->
            <div class="d-flex gap-3 justify-content-center">
              <button class="btn btn-primary px-4" [disabled]="loading" (click)="onSubmit()">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-check-lg me-2"></i>
                {{ isEditMode ? 'Modifier' : 'Enregistrer' }}
              </button>
              <button class="btn btn-secondary px-4" (click)="resetForm()">
                <i class="bi bi-arrow-repeat me-2"></i> Réinitialiser
              </button>
              <a routerLink="/list-categories" class="btn btn-link">
                <i class="bi bi-list me-2"></i> Voir la liste
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
